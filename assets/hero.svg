<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="500"
  viewBox="0 0 1280 500"
  fill="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Kevin Daniel Aguilar Junco</title>
  <desc id="description">
    Renewable Energy Engineering student, computer vision researcher,
    and founder of AquaGuard. An orbital illustration connects
    renewable energy, fish identification, and water monitoring.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="0" y1="0"
      x2="1280" y2="500"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#0B1019"/>
      <stop offset=".6" stop-color="#0D1621"/>
      <stop offset="1" stop-color="#102128"/>
    </linearGradient>

    <radialGradient
      id="ambient"
      cx="0" cy="0" r="1"
      gradientTransform="translate(1030 244) rotate(90) scale(245 270)"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#5DCAB6" stop-opacity=".085"/>
      <stop offset="1" stop-color="#5DCAB6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient
      id="border"
      x1="0" y1="0"
      x2="1280" y2="500"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#34404D"/>
      <stop offset=".55" stop-color="#202D39"/>
      <stop offset="1" stop-color="#3A555A"/>
    </linearGradient>

    <linearGradient
      id="divider"
      x1="64" y1="0"
      x2="1216" y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#D7B779" stop-opacity=".65"/>
      <stop offset=".4" stop-color="#34424F"/>
      <stop offset="1" stop-color="#5DCAB6" stop-opacity=".45"/>
    </linearGradient>

    <pattern
      id="grid"
      width="24"
      height="24"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="1"
        cy="1"
        r=".8"
        fill="#A0B4BF"
        fill-opacity=".13"
      />
    </pattern>

    <clipPath id="canvas">
      <rect x="1" y="1" width="1278" height="498" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Helvetica, Arial, sans-serif;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas,
                   "Liberation Mono", monospace;
    }

    .orbit {
      transform-box: view-box;
      transform-origin: 1030px 244px;
      animation: orbit 65s linear infinite;
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit {
        animation: none;
      }
    }
  </style>

  <g clip-path="url(#canvas)">

    <!-- Background -->
    <rect width="1280" height="500" fill="url(#background)"/>
    <rect x="788" y="24" width="460" height="406" fill="url(#grid)"/>
    <rect width="1280" height="500" fill="url(#ambient)"/>

    <!-- Small identity line -->
    <path
      d="M64 55H85"
      stroke="#D7B779"
      stroke-width="2"
      stroke-linecap="round"
    />

    <text
      x="99" y="60"
      class="mono"
      fill="#A7B6C4"
      font-size="13"
      letter-spacing=".5"
    >@DanielAguilarJ</text>

    <!-- Name -->
    <text
      x="60" y="172"
      class="sans"
      fill="#F1F2EE"
      font-size="76"
      font-weight="650"
      letter-spacing="-3"
    >Kevin Daniel</text>

    <text
      x="60" y="252"
      class="sans"
      fill="#F1F2EE"
      font-size="76"
      font-weight="650"
      letter-spacing="-3"
    >Aguilar Junco<tspan fill="#D7B779">.</tspan></text>

    <!-- Factual positioning -->
    <text
      x="64" y="305"
      class="sans"
      fill="#D7B779"
      font-size="25"
      font-weight="500"
    >Renewable Energy Engineering student</text>

    <text
      x="64" y="343"
      class="sans"
      fill="#B0BECD"
      font-size="22"
    >Computer vision researcher</text>

    <text
      x="64" y="379"
      class="sans"
      fill="#B0BECD"
      font-size="22"
    >Founder, <tspan fill="#83D7C7">AquaGuard</tspan></text>

    <!-- Orbital diagram -->
    <circle
      cx="1030" cy="244" r="188"
      stroke="#7C9AA5"
      stroke-opacity=".12"
    />

    <circle
      cx="1030" cy="244" r="142"
      stroke="#7C9AA5"
      stroke-opacity=".20"
    />

    <!-- Single slow-moving accent -->
    <g class="orbit">
      <circle
        cx="1030" cy="244" r="188"
        stroke="#83D7C7"
        stroke-opacity=".48"
        stroke-dasharray="66 1116"
        stroke-linecap="round"
      />

      <circle
        cx="1030" cy="56" r="3"
        fill="#D7B779"
      />
    </g>

    <!-- Connections -->
    <g stroke-width="1.2">
      <path
        d="M1030 183V143"
        stroke="#D7B779"
        stroke-opacity=".45"
      />

      <path
        d="M975 272L925 297"
        stroke="#82B8D5"
        stroke-opacity=".45"
      />

      <path
        d="M1085 272L1135 297"
        stroke="#83D7C7"
        stroke-opacity=".45"
      />
    </g>

    <!-- Personal monogram -->
    <circle
      cx="1030" cy="244" r="62"
      fill="#101D28"
      stroke="#3B5059"
    />

    <circle
      cx="1030" cy="244" r="54"
      stroke="#7C9AA5"
      stroke-opacity=".10"
    />

    <text
      x="1030" y="256"
      text-anchor="middle"
      class="sans"
      fill="#E9EFEC"
      font-size="35"
      font-weight="500"
      letter-spacing="-2"
    >DA</text>

    <path
      d="M1017 274H1043"
      stroke="#D7B779"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Renewable energy -->
    <circle
      cx="1030" cy="103" r="40"
      fill="#151F27"
      stroke="#D7B779"
      stroke-opacity=".60"
    />

    <g
      stroke="#E1C38A"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle
        cx="1030" cy="85" r="7"
        fill="#D7B779"
        fill-opacity=".12"
      />

      <path d="M1030 73V69M1018 85H1014M1042 85H1046"/>
      <path d="M1021 76L1018 73M1039 76L1042 73"/>

      <path
        d="M1010 102H1050L1056 123H1004L1010 102Z"
        fill="#D7B779"
        fill-opacity=".06"
      />

      <path d="M1007 112H1053"/>
      <path d="M1023 102L1021 123M1037 102L1039 123"/>
      <path d="M1030 123V131M1020 131H1040"/>
    </g>

    <text
      x="1030" y="161"
      text-anchor="middle"
      class="mono"
      fill="#DCC18D"
      font-size="10"
      letter-spacing="1.2"
    >RENEWABLE ENERGY</text>

    <!-- Fish identification -->
    <circle
      cx="890" cy="315" r="40"
      fill="#111E2A"
      stroke="#82B8D5"
      stroke-opacity=".60"
    />

    <g
      stroke="#99C8E0"
      stroke-width="1.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    >
      <path
        d="M865 301V294H872
           M908 294H915V301
           M865 329V336H872
           M908 336H915V329"
        stroke-opacity=".65"
      />

      <path
        d="M869 315
           C879 303 894 303 904 313
           L913 307V324L904 318
           C894 328 879 328 869 315Z"
        fill="#82B8D5"
        fill-opacity=".10"
      />

      <path
        d="M883 307L890 301L897 308"
        stroke-opacity=".6"
      />

      <circle
        cx="877" cy="313" r="1.7"
        fill="#C5E4F3"
        stroke="none"
      />
    </g>

    <text
      x="890" y="375"
      text-anchor="middle"
      class="mono"
      fill="#A1C9DE"
      font-size="10"
      letter-spacing="1.2"
    >COMPUTER VISION</text>

    <!-- Water monitoring -->
    <circle
      cx="1170" cy="315" r="40"
      fill="#102328"
      stroke="#83D7C7"
      stroke-opacity=".60"
    />

    <path
      d="M1170 291
         C1170 291 1155 309 1155 319
         C1155 328 1161 335 1170 335
         C1179 335 1185 328 1185 319
         C1185 309 1170 291 1170 291Z"
      fill="#83D7C7"
      fill-opacity=".09"
      stroke="#94DECF"
      stroke-width="1.6"
    />

    <path
      d="M1160 320H1165L1168 314L1172 325L1176 318H1180"
      stroke="#B2E9DF"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <text
      x="1170" y="375"
      text-anchor="middle"
      class="mono"
      fill="#9BDCCC"
      font-size="10"
      letter-spacing="1.2"
    >AQUAGUARD</text>

    <!-- Footer -->
    <path d="M64 437H1216" stroke="url(#divider)"/>

    <text
      x="64" y="471"
      class="mono"
      fill="#91A4B5"
      font-size="12"
      letter-spacing=".6"
    >Mexico <tspan fill="#586F80">/</tspan> Czech Republic <tspan fill="#586F80">/</tspan> Germany</text>

    <text
      x="1216" y="471"
      text-anchor="end"
      class="mono"
      fill="#91A4B5"
      font-size="12"
      letter-spacing=".4"
    >danieljunco.com</text>

  </g>

  <rect
    x="1" y="1"
    width="1278" height="498"
    rx="22"
    stroke="url(#border)"
    stroke-width="2"
  />
</svg>
